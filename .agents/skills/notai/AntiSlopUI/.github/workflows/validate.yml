name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml || true
      - run: python scripts/stats.py
      - run: python scripts/validate.py
      - run: python scripts/golden.py
      - run: |
          output=$(mktemp -d)
          python ui-ux-pro-max/scripts/search.py "validation probe" --design-system --persist -p ValidateProbe -o "$output"
          python scripts/audit.py "$output/design-system/validateprobe/MASTER.md"
        working-directory: .
