name: Server 24/7 Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from idling/sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render API Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Keep-Alive Health Endpoint
        run: |
          echo "Sending keep-alive request to Shiv-Naresh API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://shivnaresh-api.onrender.com/api/health" || echo "failed")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is active, awake and healthy!"
          else
            echo "⚠️ Server returned status $STATUS (or woke up), ping succeeded in resetting inactivity timer."
          fi
