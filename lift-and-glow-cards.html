<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lift and Glow Cards</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #192332;
    }

    .card-grid {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }

    .card-lift-glow {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      padding: 28px;
      border-radius: 18px;
      border: 1px solid rgba(25, 35, 50, .1);
      background: #ffffff;
      color: inherit;
      text-decoration: none;
      text-align: left;
      font: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px -6px rgba(25, 35, 50, .12);
      transition:
        transform 320ms cubic-bezier(.22, .61, .36, 1),
        box-shadow 320ms cubic-bezier(.22, .61, .36, 1);
    }

    @media (hover: hover) {
      .card-lift-glow:hover {
        transform: translateY(-12px) scale(1.015);
        box-shadow: 0 18px 34px -14px rgba(25, 35, 50, .34), 0 0 26px -4px rgba(62, 112, 150, .32);
      }
    }

    .card-lift-glow:focus-visible {
      outline: 2px solid #3e7096;
      outline-offset: 4px;
      transform: translateY(-12px) scale(1.015);
      box-shadow: 0 18px 34px -14px rgba(25, 35, 50, .34), 0 0 26px -4px rgba(62, 112, 150, .32);
    }

    @media (prefers-reduced-motion: reduce) {
      .card-lift-glow {
        transition: none;
      }

      .card-lift-glow:hover,
      .card-lift-glow:focus-visible {
        transform: none;
      }
    }

    .card-tag {
      display: inline-block;
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #3e7096;
      background: rgba(62, 112, 150, .1);
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .card-desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: #516075;
    }

    .card-cta {
      font-size: 13px;
      font-weight: 600;
      color: #3e7096;
    }
  </style>
</head>
<body>
  <main class="card-grid" aria-label="Featured studio cards">
    <a class="card-lift-glow" href="#lookbook">
      <div>
        <span class="card-tag">01 / Lookbook</span>
        <h2 class="card-title">Virtual Try-On Studio</h2>
        <p class="card-desc">Pair garments with curated studio models and render crisp editorial lookbooks in seconds.</p>
      </div>
      <span class="card-cta">Open Studio &rarr;</span>
    </a>

    <button class="card-lift-glow" type="button">
      <div>
        <span class="card-tag">02 / Archive</span>
        <h2 class="card-title">Saved Outfit Sets</h2>
        <p class="card-desc">Organize, drag to reorder, and reload your favorite garment and model combinations in one click.</p>
      </div>
      <span class="card-cta">Manage Sets &rarr;</span>
    </button>

    <a class="card-lift-glow" href="#catalog">
      <div>
        <span class="card-tag">03 / Catalog</span>
        <h2 class="card-title">Model Categories</h2>
        <p class="card-desc">Arrange seasonal collections and studio model categories in the exact order your team needs.</p>
      </div>
      <span class="card-cta">Browse Catalog &rarr;</span>
    </a>
  </main>
</body>
</html>
