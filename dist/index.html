<!doctype html>
<html lang="en" class="light" style="background-color: #756357; color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#756357" />
    <style>
      html, body {
        background-color: #756357 !important;
        color-scheme: light;
        margin: 0;
        padding: 0;
      }
      html.dark, html.dark body {
        background-color: #08090A !important;
        color-scheme: dark;
      }
      html.light, html.light body {
        background-color: #756357 !important;
        color-scheme: light;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shivnaresh_theme');
          var root = document.documentElement;
          if (saved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#08090A';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#756357';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>Shiv-Naresh — A Quality Sports Wear</title>
