services:
  # Full-Stack Web Service: Runs React Frontend (dist) + Node.js Express Backend together on https://shivnaresh-studio.onrender.com
  - type: web
    name: shivnaresh-studio
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
