<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Shiv-Naresh — A Quality Sports Wear</title>
    <meta
      name="description"
      content="Clothes customization for clubs and teams: sublimation, embroidery, crests, names and numbers. Sampled before a single garment is cut."
    />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/hero-base.webp" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shivnaresh_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
